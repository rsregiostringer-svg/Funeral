version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: alaala_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-alaala_db}
      POSTGRES_USER: ${DB_USER:-alaala_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alaala_secure_pgpass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alaala_admin} -d ${DB_NAME:-alaala_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alaala_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-alaala-prod-secret-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgres://${DB_USER:-alaala_admin}:${DB_PASSWORD:-alaala_secure_pgpass_2026}@db:5432/${DB_NAME:-alaala_db}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

volumes:
  postgres_data:
